plugins {
    id 'com.android.application'
}

def fixedKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def fixedKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def fixedKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def fixedKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def fixedSigningAvailable = [
        fixedKeystorePath,
        fixedKeystorePassword,
        fixedKeyAlias,
        fixedKeyPassword
].every { value -> value != null && !value.isEmpty() }

android {
    namespace 'com.lantern.padcursor'
    compileSdk 34

    defaultConfig {
        applicationId "com.lantern.padcursor"
        minSdk 28
        targetSdk 28
        versionCode 7
        versionName "0.3.4"
    }

    signingConfigs {
        if (fixedSigningAvailable) {
            fixedRelease {
                storeFile file(fixedKeystorePath)
                storePassword fixedKeystorePassword
                keyAlias fixedKeyAlias
                keyPassword fixedKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (fixedSigningAvailable) {
                signingConfig signingConfigs.fixedRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // This is a sideload-only Android TV utility. targetSdk 28 is kept
        // intentionally for the original Android 9/JUUI behavior; the Google
        // Play publication deadline does not apply to direct APK installs.
        disable 'ExpiredTargetSdkVersion'
    }
}
